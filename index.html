<html>
<head>
  <style>
  #pixelCanvas {
    border-collapse: collapse;
    margin-top: 20px;
  }
  td{
    width: 25px;
    height: 25px;
    border: 1px solid #ddd;
    cursor: pointer;

  }
  </style>

</head>
<body>
 
    <div class="controls">
  <input type="color" id="colorPicker">
   <input type="number" id="inputWidth" value="10">
  <input type="number" id="inputHeight" value="10">
   <button id="sizePicker">Create Grid</button>
   <button id="eraserBtn">Eraser: OFF</button>
  </div>
  <table id="pixelCanvas"></table>
 
    <script>
    let mouseIsDown = false;
    window.onmousedown = () => mouseIsDown = true;
window.onmouseup = () => mouseIsDown = false;

let isEraser = false;  const table = document.getElementById("pixelCanvas");
const sizePicker = document.getElementById("sizePicker");
const eraserBtn = document.getElementById("eraserBtn");
  eraserBtn.onclick = () => {
isEraser = !isEraser;
      eraserBtn.innerText = isEraser ? "Eraser: ON" : "Eraser: OFF";
  };
sizePicker.addEventListener('click', function(e){
 
  const width = document.getElementById("inputWidth").value;
  const height = document.getElementById("inputHeight").value;
 



  table.innerHTML = "";
   for (let r = 0; r < height; r++) {
      let row = table.insertRow();
    for (let c = 0; c < width; c++) {
         let cell = row.insertCell();
          const color = document.getElementById("colorPicker").value;
         cell.onmouseenter = function() {
            if (mouseIsDown) {
                this.style.backgroundColor = isEraser ? "white" : colorPicker.value;
            }
        };
        cell.onclick = function() {
            this.style.backgroundColor = isEraser ? "white" : colorPicker.value;
        };
        }
      }

});
    </script>
</body>
</html>
